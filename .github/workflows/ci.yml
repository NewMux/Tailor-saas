name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgres://erp:erp@localhost:5432/tailor_erp

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tailor_erp
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d tailor_erp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Apply database migrations
        run: pnpm exec drizzle-kit migrate

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm run build

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tailor_erp
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d tailor_erp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply database migrations
        run: pnpm exec drizzle-kit migrate

      - name: Build
        run: pnpm run build

      - name: Start server
        run: |
          nohup node dist/index.js > server.log 2>&1 &
          timeout 30 bash -c 'until curl -sf http://localhost:3000/api/auth/session >/dev/null; do sleep 1; done'
        env:
          NODE_ENV: production
          PORT: 3000
          AUTH_BASE_URL: http://localhost:3000

      - name: Run Playwright e2e tests
        run: pnpm exec playwright test
        env:
          E2E_BASE_URL: http://localhost:3000

      - name: Show server log on failure
        if: failure()
        run: cat server.log

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
