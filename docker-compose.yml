# The application stack: Postgres plus the Express/tRPC app, which serves both
# the API and the built frontend from a single origin.
#
# Used for local development AND as the Coolify "Docker Compose" build pack in
# production (see DEPLOYMENT.md). Deliberately declares no custom network and
# no host port binding: Coolify creates the network and routes the configured
# domain through its own proxy, and a custom network makes that routing
# intermittent.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tailor_erp}
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      AUTH_BASE_URL: ${AUTH_BASE_URL:?Set AUTH_BASE_URL in .env}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-}
      BUILT_IN_FORGE_API_URL: ${BUILT_IN_FORGE_API_URL:-}
      BUILT_IN_FORGE_API_KEY: ${BUILT_IN_FORGE_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Billing. All optional: with these unset the app runs with billing
      # disabled rather than paywalling a deployment nobody can pay for.
      PADDLE_ENVIRONMENT: ${PADDLE_ENVIRONMENT:-sandbox}
      PADDLE_API_KEY: ${PADDLE_API_KEY:-}
      PADDLE_CLIENT_TOKEN: ${PADDLE_CLIENT_TOKEN:-}
      PADDLE_PRICE_ID: ${PADDLE_PRICE_ID:-}
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
      BILLING_TRIAL_DAYS: ${BILLING_TRIAL_DAYS:-14}
      BILLING_GRACE_DAYS: ${BILLING_GRACE_DAYS:-7}
      BILLING_DISPLAY_PRICE: ${BILLING_DISPLAY_PRICE:-29}
      BILLING_DISPLAY_CURRENCY: ${BILLING_DISPLAY_CURRENCY:-USD}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/auth/session').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
